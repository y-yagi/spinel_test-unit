name: Test

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    timeout-minutes: 10
    strategy:
      # Keep the other Rubies running (and caching Spinel) if one fails.
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Spinel's build runs `require "prism"` with plain ruby; prism is a
      # default gem only since Ruby 3.3.
      - name: Install prism
        if: matrix.ruby == '3.2'
        run: gem install prism
      # Spinel from mise.toml (the mise-spinel plugin).
      - name: Install Spinel
        uses: jdx/mise-action@v5.2.0
        with:
          install_args: spinel
      - name: Show Spinel
        run: spinel --version
      - name: Run the tests
        run: bundle exec rake test
